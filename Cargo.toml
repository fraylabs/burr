[package]
name = "burr"
version = "0.39.1"
edition = "2021"
description = "Fast local browser and assembly interference checker for CAD models."
license = "MIT"
repository = "https://github.com/fraylabs/burr"
publish = false

[dependencies]
blake3 = "1.8"
glam = "0.30"
look = { git = "https://github.com/fraylabs/look.git", rev = "6b1021cd0d7e4f19a7d94f67ae92987db853d223" }
percent-encoding = "2.3.2"
ruststep = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12.0"
truck-assembly = "0.1"
truck-topology = "0.6"
truck-stepio = "0.3"
toml = "0.9"

tempfile = "3.12"

[patch.crates-io]
# Keep all geometry types on the same vendored kernel revision as Look.
ruststep = { git = "https://github.com/stefangolas/ruststep", rev = "67f1f7c" }
truck-assembly = { git = "https://github.com/fraylabs/look.git", rev = "6b1021cd0d7e4f19a7d94f67ae92987db853d223" }
truck-base = { git = "https://github.com/fraylabs/look.git", rev = "6b1021cd0d7e4f19a7d94f67ae92987db853d223" }
truck-derivers = { git = "https://github.com/fraylabs/look.git", rev = "6b1021cd0d7e4f19a7d94f67ae92987db853d223" }
truck-geometry = { git = "https://github.com/fraylabs/look.git", rev = "6b1021cd0d7e4f19a7d94f67ae92987db853d223" }
truck-geotrait = { git = "https://github.com/fraylabs/look.git", rev = "6b1021cd0d7e4f19a7d94f67ae92987db853d223" }
truck-meshalgo = { git = "https://github.com/fraylabs/look.git", rev = "6b1021cd0d7e4f19a7d94f67ae92987db853d223" }
truck-modeling = { git = "https://github.com/fraylabs/look.git", rev = "6b1021cd0d7e4f19a7d94f67ae92987db853d223" }
truck-polymesh = { git = "https://github.com/fraylabs/look.git", rev = "6b1021cd0d7e4f19a7d94f67ae92987db853d223" }
truck-stepio = { git = "https://github.com/fraylabs/look.git", rev = "6b1021cd0d7e4f19a7d94f67ae92987db853d223" }
truck-topology = { git = "https://github.com/fraylabs/look.git", rev = "6b1021cd0d7e4f19a7d94f67ae92987db853d223" }
