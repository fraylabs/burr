[package]
name = "burr"
version = "0.31.0"
edition = "2021"
description = "Fast local browser and assembly interference checker for CAD models."
license = "MIT"
repository = "https://github.com/fraylabs/burr"
publish = false

[dependencies]
glam = "0.30"
look = { git = "https://github.com/stefangolas/look.git", rev = "f0ed52edc1f0648cdece331002b38ed33e7c541a" }
percent-encoding = "2.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12.0"
toml = "0.9"
truck-meshalgo = { git = "https://github.com/stefangolas/truck", rev = "09726a9e", default-features = false, features = ["analyzers", "filters"] }

[dev-dependencies]
tempfile = "3.12"

[patch.crates-io]
ruststep = { git = "https://github.com/stefangolas/ruststep", rev = "67f1f7c" }
truck-assembly = { git = "https://github.com/stefangolas/truck", rev = "09726a9e" }
truck-base = { git = "https://github.com/stefangolas/truck", rev = "09726a9e" }
truck-derivers = { git = "https://github.com/stefangolas/truck", rev = "09726a9e" }
truck-geometry = { git = "https://github.com/stefangolas/truck", rev = "09726a9e" }
truck-geotrait = { git = "https://github.com/stefangolas/truck", rev = "09726a9e" }
truck-meshalgo = { git = "https://github.com/stefangolas/truck", rev = "09726a9e" }
truck-modeling = { git = "https://github.com/stefangolas/truck", rev = "09726a9e" }
truck-polymesh = { git = "https://github.com/stefangolas/truck", rev = "09726a9e" }
truck-stepio = { git = "https://github.com/stefangolas/truck", rev = "09726a9e" }
truck-topology = { git = "https://github.com/stefangolas/truck", rev = "09726a9e" }
