[package]
name = "burr"
version = "0.35.0"
edition = "2021"
description = "Fast local browser and assembly interference checker for CAD models."
license = "MIT"
repository = "https://github.com/fraylabs/burr"
publish = false

[dependencies]
blake3 = "1.8"
glam = "0.30"
look = { git = "https://github.com/stefangolas/look.git", rev = "dc6687c5a579cee5cdfe91411d30bb71d19a5ac6" }
percent-encoding = "2.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12.0"
toml = "0.9"
truck-meshalgo = { git = "https://github.com/stefangolas/look.git", rev = "dc6687c5a579cee5cdfe91411d30bb71d19a5ac6", default-features = false, features = ["analyzers", "filters"] }

[dev-dependencies]
tempfile = "3.12"

[patch.crates-io]
# Keep all geometry types on the same vendored kernel revision as Look.
ruststep = { git = "https://github.com/stefangolas/ruststep", rev = "67f1f7c" }
truck-assembly = { git = "https://github.com/stefangolas/look.git", rev = "dc6687c5a579cee5cdfe91411d30bb71d19a5ac6" }
truck-base = { git = "https://github.com/stefangolas/look.git", rev = "dc6687c5a579cee5cdfe91411d30bb71d19a5ac6" }
truck-derivers = { git = "https://github.com/stefangolas/look.git", rev = "dc6687c5a579cee5cdfe91411d30bb71d19a5ac6" }
truck-geometry = { git = "https://github.com/stefangolas/look.git", rev = "dc6687c5a579cee5cdfe91411d30bb71d19a5ac6" }
truck-geotrait = { git = "https://github.com/stefangolas/look.git", rev = "dc6687c5a579cee5cdfe91411d30bb71d19a5ac6" }
truck-meshalgo = { git = "https://github.com/stefangolas/look.git", rev = "dc6687c5a579cee5cdfe91411d30bb71d19a5ac6" }
truck-modeling = { git = "https://github.com/stefangolas/look.git", rev = "dc6687c5a579cee5cdfe91411d30bb71d19a5ac6" }
truck-polymesh = { git = "https://github.com/stefangolas/look.git", rev = "dc6687c5a579cee5cdfe91411d30bb71d19a5ac6" }
truck-stepio = { git = "https://github.com/stefangolas/look.git", rev = "dc6687c5a579cee5cdfe91411d30bb71d19a5ac6" }
truck-topology = { git = "https://github.com/stefangolas/look.git", rev = "dc6687c5a579cee5cdfe91411d30bb71d19a5ac6" }
