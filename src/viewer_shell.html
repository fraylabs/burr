<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d0f" />
    <link rel="icon" type="image/png" href="/assets/burr-logo.png" />
    <title>Burr model browser</title>
    <script>
      (() => {
        const saved = localStorage.getItem("burr-theme");
        const theme =
          saved === "dark" || saved === "light"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        const savedRenderMode = localStorage.getItem("burr-render-mode");
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.renderMode =
          savedRenderMode === "solid" ? "solid" : "x-ray";
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #0c0d10;
        --sidebar: #111215;
        --surface: #17191d;
        --surface-hover: #1d2024;
        --surface-selected: #24272c;
        --border: #2a2d33;
        --border-strong: #3b4047;
        --text: #f3f4f5;
        --text-secondary: #b6bbc0;
        --text-muted: #858c92;
        --steel: #aebfc8;
        --steel-surface: #263239;
        --accent: #f08a32;
        --success: #6fbd88;
        --danger: #dd746d;
        --shadow: rgba(0, 0, 0, 0.42);
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-pill: 999px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: var(--canvas);
        color: var(--text);
        font-synthesis: none;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --canvas: #c9ced0;
        --sidebar: #f4f3ef;
        --surface: #fbfaf7;
        --surface-hover: #e9e7e1;
        --surface-selected: #ffffff;
        --border: #d5d2cb;
        --border-strong: #b9b7b0;
        --text: #1b1d1f;
        --text-secondary: #555b60;
        --text-muted: #777e83;
        --steel: #4f6671;
        --steel-surface: #dce4e7;
        --accent: #d86d16;
        --success: #3d8a58;
        --danger: #b94f48;
        --shadow: rgba(31, 35, 38, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      button {
        font: inherit;
      }

      #app {
        display: grid;
        grid-template-columns: 278px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        background: var(--canvas);
      }

      .sidebar {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--border);
        background: var(--sidebar);
      }

      .sidebar-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 74px;
        padding: 14px 17px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .brand-mark {
        flex: 0 0 auto;
        width: 35px;
        height: 35px;
        object-fit: contain;
      }

      .eyebrow {
        margin: 0 0 3px;
        color: var(--text-muted);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1,
      p {
        margin-top: 0;
      }

      h1 {
        max-width: 190px;
        margin-bottom: 0;
        overflow: hidden;
        color: var(--text);
        font-size: 14px;
        font-weight: 680;
        letter-spacing: -0.01em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sidebar-tabs {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 8px 9px;
        border-bottom: 1px solid var(--border);
        background: var(--sidebar);
      }

      .sidebar-tab {
        min-width: 0;
        min-height: 31px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
      }

      .sidebar-tab:hover {
        background: var(--surface-hover);
        color: var(--text-secondary);
      }

      .sidebar-tab[aria-selected="true"] {
        border-color: var(--border);
        background: var(--surface);
        color: var(--text);
      }

      .check-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-muted);
      }

      .check-dot.pass {
        background: var(--success);
      }

      .check-dot.fail {
        background: var(--danger);
      }

      .check-dot.incomplete {
        background: var(--accent);
      }

      .side-panel {
        min-height: 0;
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
      }

      .side-panel[hidden] {
        display: none;
      }

      .tree-toolbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 17px 10px;
      }

      .tree-toolbar strong {
        color: var(--text-secondary);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .model-count {
        padding: 3px 7px;
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        background: var(--surface);
        color: var(--text-muted);
        font-size: 9px;
        font-variant-numeric: tabular-nums;
      }

      .tree {
        min-height: 0;
        flex: 1 1 auto;
        overflow: auto;
        padding: 2px 9px 18px;
        scrollbar-color: var(--border-strong) transparent;
        scrollbar-width: thin;
      }

      details {
        margin: 1px 0;
      }

      summary {
        min-width: 0;
        min-height: 31px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 8px;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 620;
        cursor: pointer;
        list-style: none;
        user-select: none;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      summary:hover {
        background: var(--surface-hover);
        color: var(--text);
      }

      .folder-caret {
        flex: 0 0 auto;
        width: 11px;
        color: var(--text-muted);
        font-size: 9px;
        transition: transform 120ms ease;
      }

      details[open] > summary .folder-caret {
        transform: rotate(90deg);
      }

      .folder-icon {
        flex: 0 0 auto;
        width: 13px;
        height: 9px;
        border: 1px solid var(--steel);
        border-radius: 2px;
        background: var(--steel-surface);
        position: relative;
      }

      .folder-name {
        min-width: 0;
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .folder-icon::before {
        content: "";
        position: absolute;
        top: -4px;
        left: -1px;
        width: 6px;
        height: 3px;
        border: 1px solid var(--steel);
        border-bottom: 0;
        border-radius: 2px 2px 0 0;
        background: var(--steel-surface);
      }

      .folder-children {
        margin-left: 9px;
        padding-left: 8px;
        border-left: 1px solid var(--border);
      }

      .model-file {
        width: 100%;
        min-height: 34px;
        display: grid;
        grid-template-columns: 31px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        margin: 1px 0;
        padding: 4px 8px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-secondary);
        text-align: left;
        cursor: pointer;
      }

      .model-file:hover {
        background: var(--surface-hover);
        color: var(--text);
      }

      .model-file[aria-current="true"] {
        border-color: var(--border-strong);
        background: var(--surface-selected);
        color: var(--text);
        box-shadow: inset 2px 0 var(--accent);
      }

      .format-badge {
        padding: 3px 4px;
        border-radius: 4px;
        background: var(--steel-surface);
        color: var(--steel);
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-align: center;
      }

      .file-name {
        min-width: 0;
        overflow: hidden;
        font-size: 11px;
        font-weight: 570;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .empty-tree {
        margin: 13px 8px;
        padding: 17px 14px;
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-md);
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1.55;
      }

      .checks-panel {
        overflow: auto;
        padding: 14px 12px 18px;
        scrollbar-color: var(--border-strong) transparent;
        scrollbar-width: thin;
      }

      .check-card {
        padding: 13px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
      }

      .check-card + .check-card,
      .finding-list {
        margin-top: 10px;
      }

      .check-status-line {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .check-status {
        color: var(--text);
        font-size: 11px;
        font-weight: 750;
        text-transform: capitalize;
      }

      .check-summary,
      .check-reason {
        margin: 0;
        color: var(--text-muted);
        font-size: 10px;
        line-height: 1.55;
      }

      .check-reason + .check-reason {
        margin-top: 7px;
      }

      .finding-list {
        display: grid;
        gap: 7px;
      }

      .finding {
        width: 100%;
        display: grid;
        grid-template-columns: 3px minmax(0, 1fr);
        gap: 10px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text-secondary);
        text-align: left;
        cursor: pointer;
      }

      .finding::before {
        content: "";
        border-radius: var(--radius-pill);
        background: var(--danger);
      }

      .finding:hover,
      .finding[aria-current="true"] {
        border-color: var(--border-strong);
        background: var(--surface-selected);
      }

      .finding[aria-current="true"] {
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent);
      }

      .finding strong,
      .finding span {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .finding strong {
        color: var(--text);
        font-size: 10px;
      }

      .finding span {
        margin-top: 3px;
        color: var(--text-muted);
        font-size: 9px;
      }

      .clear-highlight {
        width: 100%;
        margin-top: 10px;
        padding: 7px 9px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-secondary);
        font-size: 9px;
        font-weight: 700;
        cursor: pointer;
      }

      .clear-highlight:hover {
        border-color: var(--border-strong);
        background: var(--surface-hover);
        color: var(--text);
      }

      .sidebar-footer {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 47px;
        padding: 0 17px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-muted);
        font-size: 10px;
      }

      .watch-status-group {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #watch-status {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .theme-toggle {
        flex: 0 0 auto;
        min-width: 48px;
        margin-left: auto;
        padding: 5px 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        background: var(--sidebar);
        color: var(--text-secondary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.03em;
        cursor: pointer;
      }

      .theme-toggle:hover {
        border-color: var(--border-strong);
        background: var(--surface-hover);
        color: var(--text);
      }

      .theme-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .watch-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 12%, transparent);
      }

      .watch-dot.error {
        background: var(--danger);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 12%, transparent);
      }

      .viewer {
        position: relative;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
        background: var(--canvas);
      }

      #model-viewer {
        width: 100%;
        height: 100%;
        display: block;
        border: 0;
        background: var(--canvas);
      }

      .viewer-controls {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .snapshot-button,
      .render-mode-toggle {
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--surface) 90%, transparent);
        box-shadow: 0 10px 28px var(--shadow);
        backdrop-filter: blur(12px);
      }

      .snapshot-button {
        min-width: 76px;
        padding: 9px 12px;
        border-radius: var(--radius-pill);
        color: var(--text-secondary);
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
      }

      .snapshot-button:hover:not(:disabled) {
        border-color: var(--border-strong);
        color: var(--text);
      }

      .snapshot-button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      .snapshot-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .render-mode-toggle {
        display: flex;
        gap: 3px;
        padding: 3px;
        border-radius: var(--radius-pill);
      }

      .render-mode-option {
        padding: 6px 10px;
        border: 0;
        border-radius: var(--radius-pill);
        background: transparent;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
      }

      .render-mode-option:hover {
        color: var(--text);
      }

      .render-mode-option[aria-pressed="true"] {
        background: var(--surface-selected);
        color: var(--text);
        box-shadow: 0 1px 5px var(--shadow);
      }

      .render-mode-option:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .motion-controls {
        position: absolute;
        left: 50%;
        bottom: 72px;
        z-index: 3;
        width: min(560px, calc(100% - 36px));
        display: grid;
        grid-template-columns: auto auto minmax(120px, 1fr) auto;
        align-items: center;
        gap: 11px;
        padding: 8px 11px;
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        box-shadow: 0 12px 32px var(--shadow);
        backdrop-filter: blur(12px);
        transform: translateX(-50%);
      }

      .motion-controls[hidden] {
        display: none;
      }

      .motion-play {
        min-width: 58px;
        padding: 7px 11px;
        border: 0;
        border-radius: var(--radius-pill);
        background: var(--surface-selected);
        color: var(--text);
        font-size: 10px;
        font-weight: 750;
        cursor: pointer;
      }

      .motion-play:hover {
        background: var(--surface-hover);
      }

      .motion-play:focus-visible,
      .motion-progress:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .motion-label {
        min-width: 0;
        overflow: hidden;
        color: var(--text-muted);
        font-size: 9px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .motion-progress {
        width: 100%;
        min-width: 0;
        accent-color: var(--accent);
        cursor: ew-resize;
      }

      .viewer-state {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--canvas);
        z-index: 2;
      }

      .viewer-state[hidden] {
        display: none;
      }

      .state-content {
        max-width: 420px;
        text-align: center;
      }

      .state-mark {
        width: 38px;
        height: 38px;
        margin: 0 auto 18px;
        border: 1px solid var(--border-strong);
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--steel);
        font-size: 18px;
      }

      .state-content strong {
        display: block;
        margin-bottom: 7px;
        color: var(--text);
        font-size: 14px;
      }

      .state-content p {
        margin-bottom: 0;
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1.6;
      }

      .loading-ring {
        width: 23px;
        height: 23px;
        border: 2px solid var(--border-strong);
        border-top-color: var(--steel);
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 720px) {
        #app {
          grid-template-columns: 220px minmax(0, 1fr);
        }

        .motion-controls {
          grid-template-columns: auto minmax(90px, 1fr);
        }

        .motion-label {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" aria-label="Model files">
        <header class="sidebar-header">
          <img class="brand-mark" src="/assets/burr-logo.png" alt="" />
          <div>
            <p class="eyebrow">Burr</p>
            <h1 id="root-name">Model browser</h1>
          </div>
        </header>

        <div class="sidebar-tabs" role="tablist" aria-label="Burr workbench">
          <button
            id="models-tab"
            class="sidebar-tab"
            type="button"
            role="tab"
            aria-controls="models-panel"
            aria-selected="true"
          >
            Models
          </button>
          <button
            id="checks-tab"
            class="sidebar-tab"
            type="button"
            role="tab"
            aria-controls="checks-panel"
            aria-selected="false"
          >
            <span id="check-dot" class="check-dot" aria-hidden="true"></span>
            Checks
          </button>
        </div>

        <section id="models-panel" class="side-panel" role="tabpanel" aria-labelledby="models-tab">
          <div class="tree-toolbar">
            <strong>Files</strong>
            <span id="model-count" class="model-count">0</span>
          </div>

          <nav id="tree" class="tree" aria-label="Supported model files"></nav>
        </section>

        <section
          id="checks-panel"
          class="side-panel checks-panel"
          role="tabpanel"
          aria-labelledby="checks-tab"
          hidden
        >
          <div id="checks-content" class="check-card">
            <div class="check-status-line">
              <span class="check-dot" aria-hidden="true"></span>
              <span class="check-status">Select a model</span>
            </div>
            <p class="check-summary">Burr checks STEP assemblies for interfering solid volumes.</p>
          </div>
        </section>

        <footer class="sidebar-footer">
          <div class="watch-status-group">
            <span id="watch-dot" class="watch-dot" aria-hidden="true"></span>
            <span id="watch-status">Watching for model changes</span>
          </div>
          <button id="theme-toggle" class="theme-toggle" type="button">Dark</button>
        </footer>
      </aside>

      <main class="viewer" aria-label="Selected model viewer">
        <iframe id="model-viewer" title="Selected 3D model"></iframe>

        <div class="viewer-controls">
          <button
            id="snapshot-button"
            class="snapshot-button"
            type="button"
            aria-label="Export current model view as PNG"
            disabled
          >
            Snapshot
          </button>
          <div class="render-mode-toggle" role="group" aria-label="Model appearance">
            <button
              class="render-mode-option"
              type="button"
              data-render-mode="x-ray"
              aria-pressed="true"
            >
              X-ray
            </button>
            <button
              class="render-mode-option"
              type="button"
              data-render-mode="solid"
              aria-pressed="false"
            >
              Solid
            </button>
          </div>
        </div>

        <div id="motion-controls" class="motion-controls" aria-label="Model motion" hidden>
          <button id="motion-play" class="motion-play" type="button">Play</button>
          <span id="motion-from" class="motion-label">Start</span>
          <input
            id="motion-progress"
            class="motion-progress"
            type="range"
            min="0"
            max="1000"
            value="0"
            aria-label="Motion progress"
          />
          <span id="motion-to" class="motion-label">End</span>
        </div>

        <div id="empty-state" class="viewer-state">
          <div class="state-content">
            <div class="state-mark" aria-hidden="true">⌁</div>
            <strong>No supported models found</strong>
            <p>Add a STEP, STL, or GLB file anywhere inside this folder.</p>
          </div>
        </div>

        <div
          id="loading-state"
          class="viewer-state"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          hidden
        >
          <div class="state-content">
            <div class="state-mark" aria-hidden="true">
              <span class="loading-ring"></span>
            </div>
            <strong id="loading-title">Preparing model</strong>
            <p id="loading-stage">Reading the source file locally.</p>
          </div>
        </div>
      </main>
    </div>

    <script>
      const rootName = document.querySelector("#root-name");
      const modelCount = document.querySelector("#model-count");
      const tree = document.querySelector("#tree");
      const modelsTab = document.querySelector("#models-tab");
      const checksTab = document.querySelector("#checks-tab");
      const modelsPanel = document.querySelector("#models-panel");
      const checksPanel = document.querySelector("#checks-panel");
      const checksContent = document.querySelector("#checks-content");
      const checkDot = document.querySelector("#check-dot");
      const viewer = document.querySelector("#model-viewer");
      const emptyState = document.querySelector("#empty-state");
      const loadingState = document.querySelector("#loading-state");
      const loadingTitle = document.querySelector("#loading-title");
      const loadingStage = document.querySelector("#loading-stage");
      const watchDot = document.querySelector("#watch-dot");
      const watchStatus = document.querySelector("#watch-status");
      const themeToggle = document.querySelector("#theme-toggle");
      const snapshotButton = document.querySelector("#snapshot-button");
      const renderModeButtons = [...document.querySelectorAll(".render-mode-option")];
      const motionControls = document.querySelector("#motion-controls");
      const motionPlay = document.querySelector("#motion-play");
      const motionProgress = document.querySelector("#motion-progress");
      const motionFrom = document.querySelector("#motion-from");
      const motionTo = document.querySelector("#motion-to");
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const loadSession = globalThis.crypto?.randomUUID?.() ||
        `tab-${Date.now()}-${Math.floor(Math.random() * 1_000_000)}`;

      const state = {
        files: [],
        motions: [],
        selectedPath: null,
        selectedVersion: null,
        signature: "",
        expanded: new Set(),
        initialized: false,
        refreshing: false,
        checkRequest: 0,
        checkReport: null,
        focusedFinding: null,
        snapshotReset: null,
        activeMotion: null,
        motionProgress: 0,
        motionPlaying: false,
        motionReady: false,
        motionSuspended: false,
        motionSignature: "",
        loadSequence: 0,
        activeLoadId: null,
        activeLoadController: null,
        viewerReady: false,
        theme: document.documentElement.dataset.theme === "light" ? "light" : "dark",
        renderMode:
          document.documentElement.dataset.renderMode === "solid" ? "solid" : "x-ray",
      };

      function acceptViewerReady(loadId) {
        if (!clearActiveLoad(loadId)) return;
        loadingState.hidden = true;
        const snapshotReady = Boolean(
          state.selectedPath &&
            viewer.contentDocument?.querySelector('meta[name="burr-snapshot-export"]'),
        );
        snapshotButton.disabled = !snapshotReady;
        snapshotButton.textContent = snapshotReady ? "Snapshot" : "Unavailable";
        state.motionReady = Boolean(
          state.activeMotion &&
            !state.motionSuspended &&
            viewer.contentDocument?.querySelector('meta[name="burr-motion"]'),
        );
        renderMotionControls();
        sendRenderMode();
        sendMotionProgress();
        state.viewerReady = snapshotReady;
        const selected = state.files.find((file) => file.path === state.selectedPath);
        if (
          snapshotReady &&
          selected &&
          !state.checkReport &&
          checksTab.getAttribute("aria-selected") === "true"
        ) {
          loadChecks(selected);
        } else if (snapshotReady && selected && !state.checkReport) {
          renderCheckMessage(
            "Ready",
            "Open the Checks tab to inspect this model's component geometry.",
            null,
          );
        } else if (!snapshotReady && selected && !state.checkReport) {
          setCheckIndicator("incomplete");
          renderCheckMessage(
            "Incomplete",
            "Burr could not prepare the selected model for inspection.",
            "incomplete",
          );
        }
      }

      function failViewerLoad(loadId) {
        if (!clearActiveLoad(loadId)) return;
        loadingState.hidden = true;
        snapshotButton.disabled = true;
        snapshotButton.textContent = "Unavailable";
        state.motionReady = false;
        state.viewerReady = false;
        renderMotionControls();
        setCheckIndicator("incomplete");
        renderCheckMessage(
          "Incomplete",
          "Burr could not inspect the selected model.",
          "incomplete",
        );
      }

      function clearActiveLoad(loadId = null) {
        if (loadId && state.activeLoadId !== loadId) return false;
        state.activeLoadController?.abort();
        state.activeLoadController = null;
        state.activeLoadId = null;
        return true;
      }

      themeToggle.addEventListener("click", () => {
        setTheme(state.theme === "dark" ? "light" : "dark", true, true);
      });
      for (const button of renderModeButtons) {
        button.addEventListener("click", () => setRenderMode(button.dataset.renderMode, true));
      }
      snapshotButton.addEventListener("click", exportSnapshot);
      motionPlay.addEventListener("click", toggleMotion);
      motionProgress.addEventListener("input", setMotionProgress);
      window.addEventListener("message", receiveViewerMessage);
      modelsTab.addEventListener("click", () => showPanel("models"));
      checksTab.addEventListener("click", () => {
        showPanel("checks");
        ensureChecks();
      });

      setTheme(state.theme, false, false);
      setRenderMode(state.renderMode, false);
      refreshTree();
      setInterval(refreshTree, 1000);

      function showPanel(panel) {
        const showingChecks = panel === "checks";
        modelsTab.setAttribute("aria-selected", String(!showingChecks));
        checksTab.setAttribute("aria-selected", String(showingChecks));
        modelsPanel.hidden = showingChecks;
        checksPanel.hidden = !showingChecks;
      }

      async function refreshTree() {
        if (state.refreshing) return;
        state.refreshing = true;
        try {
          const response = await fetch("/api/tree", { cache: "no-store" });
          if (!response.ok) throw new Error(`Tree request failed: ${response.status}`);
          const payload = await response.json();
          applyTree(payload);
          watchDot.classList.remove("error");
          watchStatus.textContent = "Watching for model changes";
        } catch (error) {
          watchDot.classList.add("error");
          watchStatus.textContent = "Could not refresh model files";
          console.error(error);
        } finally {
          state.refreshing = false;
        }
      }

      function applyTree(payload) {
        const files = Array.isArray(payload.files) ? payload.files : [];
        const motions = Array.isArray(payload.motions) ? payload.motions : [];
        rootName.textContent = payload.root || "Model browser";
        rootName.title = payload.root || "Model browser";
        modelCount.textContent = String(files.length);

        const signature = JSON.stringify(files.map((file) => [file.path, file.version]));
        const selected = files.find((file) => file.path === state.selectedPath);
        const selectedChanged = selected && selected.version !== state.selectedVersion;
        const selectionRemoved = state.selectedPath && !selected;
        const motionSignature = JSON.stringify(motions);
        const motionsChanged = state.motionSignature && motionSignature !== state.motionSignature;

        state.files = files;
        state.motions = motions;
        state.motionSignature = motionSignature;
        if (signature !== state.signature) {
          state.signature = signature;
          renderTree(files);
        }

        if (files.length === 0) {
          state.selectedPath = null;
          state.selectedVersion = null;
          state.checkRequest += 1;
          state.checkReport = null;
          state.focusedFinding = null;
          state.activeMotion = null;
          state.motionReady = false;
          clearActiveLoad();
          state.viewerReady = false;
          viewer.removeAttribute("src");
          snapshotButton.disabled = true;
          loadingState.hidden = true;
          emptyState.hidden = false;
          renderChecksEmpty();
          renderMotionControls();
          return;
        }

        emptyState.hidden = true;
        if (!state.selectedPath || selectionRemoved) {
          selectFile(files[0]);
        } else if (selectedChanged || motionsChanged) {
          selectFile(selected, true);
        }
      }

      function renderTree(files) {
        const openFolders = new Set(state.expanded);
        const hierarchy = { folders: new Map(), files: [] };
        for (const file of files) {
          const pieces = file.path.split("/");
          let node = hierarchy;
          for (const piece of pieces.slice(0, -1)) {
            if (!node.folders.has(piece)) {
              node.folders.set(piece, { folders: new Map(), files: [] });
            }
            node = node.folders.get(piece);
          }
          node.files.push(file);
        }

        tree.replaceChildren();
        if (files.length === 0) {
          const message = document.createElement("div");
          message.className = "empty-tree";
          message.textContent = "No .step, .stp, .stl, or .glb files in this folder.";
          tree.append(message);
          return;
        }

        const fragment = document.createDocumentFragment();
        renderNode(hierarchy, fragment, "", openFolders);
        tree.append(fragment);
        state.initialized = true;
        updateCurrentSelection();
      }

      function renderNode(node, parent, prefix, openFolders) {
        const folders = [...node.folders.entries()].sort(([left], [right]) =>
          left.localeCompare(right, undefined, { sensitivity: "base" }),
        );
        for (const [name, child] of folders) {
          const key = prefix ? `${prefix}/${name}` : name;
          const details = document.createElement("details");
          details.dataset.folder = key;
          details.open = openFolders.has(key);
          if (details.open) state.expanded.add(key);
          details.addEventListener("toggle", () => {
            if (details.open) state.expanded.add(key);
            else state.expanded.delete(key);
          });

          const summary = document.createElement("summary");
          summary.title = key;
          const caret = document.createElement("span");
          caret.className = "folder-caret";
          caret.textContent = "▶";
          const icon = document.createElement("span");
          icon.className = "folder-icon";
          icon.setAttribute("aria-hidden", "true");
          const label = document.createElement("span");
          label.className = "folder-name";
          label.textContent = name;
          summary.append(caret, icon, label);

          const children = document.createElement("div");
          children.className = "folder-children";
          renderNode(child, children, key, openFolders);
          details.append(summary, children);
          parent.append(details);
        }

        const files = [...node.files].sort((left, right) =>
          left.name.localeCompare(right.name, undefined, { sensitivity: "base" }),
        );
        for (const file of files) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "model-file";
          button.dataset.path = file.path;
          button.title = file.path;
          button.addEventListener("click", () => selectFile(file));

          const badge = document.createElement("span");
          badge.className = "format-badge";
          badge.textContent = file.format;
          const label = document.createElement("span");
          label.className = "file-name";
          label.textContent = file.name;
          button.append(badge, label);
          parent.append(button);
        }
      }

      function selectFile(file, refreshed = false) {
        state.selectedPath = file.path;
        state.selectedVersion = file.version;
        state.checkRequest += 1;
        state.checkReport = null;
        state.focusedFinding = null;
        setCheckIndicator(null);
        renderCheckMessage("Waiting", "Checks begin after the model is visible.", null);
        selectMotion(file.path);
        updateCurrentSelection();
        emptyState.hidden = true;
        openViewer(file, refreshed);
      }

      function openViewer(file, refreshed = false, focus = null) {
        clearActiveLoad();
        const loadId = `${loadSession}-${++state.loadSequence}`;
        const loadController = new AbortController();
        state.activeLoadId = loadId;
        state.activeLoadController = loadController;
        state.viewerReady = false;
        state.motionSuspended = Boolean(focus);
        state.motionReady = false;
        renderMotionControls();
        loadingState.hidden = false;
        snapshotButton.disabled = true;
        snapshotButton.textContent = "Snapshot";
        loadingTitle.textContent = refreshed ? `Reloading ${file.name}` : `Opening ${file.name}`;
        loadingStage.textContent = "Reading the source file locally.";
        const query = new URLSearchParams({
          path: file.path,
          v: file.version,
          theme: state.theme,
          load: loadId,
        });
        if (focus) query.set("focus", focus.join(","));
        else if (state.activeMotion) query.set("motion", state.activeMotion.id);
        viewer.src = `/viewer?${query}`;
        pollLoadStatus(loadId, loadController);
      }

      async function pollLoadStatus(loadId, controller) {
        while (state.activeLoadId === loadId) {
          try {
            const query = new URLSearchParams({ id: loadId });
            const response = await fetch(`/api/load-status?${query}`, {
              cache: "no-store",
              signal: controller.signal,
            });
            if (response.ok) {
              const status = await response.json();
              if (state.activeLoadId !== loadId) return;
              loadingStage.textContent = status.detail
                ? `${status.stage} — ${status.detail}`
                : status.stage;
              if (status.state === "error") {
                failViewerLoad(loadId);
                return;
              }
            }
          } catch (error) {
            if (error.name === "AbortError") return;
            console.debug("Burr load status is temporarily unavailable", error);
          }
          await new Promise((resolve) => setTimeout(resolve, 150));
        }
      }

      function selectMotion(path) {
        const motion = state.motions.find((candidate) => candidate.model === path);
        state.activeMotion = motion || null;
        state.motionProgress = 0;
        state.motionPlaying = false;
        state.motionReady = false;
        state.motionSuspended = false;
        renderMotionControls();
      }

      function renderMotionControls() {
        const motion = state.activeMotion;
        motionControls.hidden = !motion || !state.motionReady || state.motionSuspended;
        if (!motion) return;
        motionControls.setAttribute("aria-label", motion.label || "Model motion");
        motionFrom.textContent = motion.from_label || "Start";
        motionFrom.title = motion.from_label || "Start";
        motionTo.textContent = motion.to_label || "End";
        motionTo.title = motion.to_label || "End";
        motionProgress.value = String(Math.round(state.motionProgress * 1000));
        motionPlay.textContent = state.motionPlaying
          ? "Pause"
          : state.motionProgress >= 0.999
            ? "Replay"
            : "Play";
        motionPlay.setAttribute("aria-pressed", String(state.motionPlaying));
      }

      function setMotionProgress() {
        if (!state.activeMotion || !state.motionReady) return;
        const checksWereAvailable = checksMatchVisiblePose();
        state.motionProgress = Number(motionProgress.value) / 1000;
        state.motionPlaying = false;
        renderMotionControls();
        syncChecksWithVisiblePose(checksWereAvailable);
        sendMotionProgress();
      }

      function sendMotionProgress() {
        if (!state.activeMotion || !state.motionReady || state.motionSuspended) return;
        viewer.contentWindow?.postMessage(
          { type: "burr:set-motion-progress", progress: state.motionProgress },
          window.location.origin,
        );
      }

      function toggleMotion() {
        if (!state.activeMotion || !state.motionReady) return;
        viewer.contentWindow?.postMessage(
          { type: "burr:toggle-motion" },
          window.location.origin,
        );
      }

      async function loadChecks(file) {
        if (!checksMatchVisiblePose()) {
          renderMotionCheckBoundary();
          return;
        }
        const request = ++state.checkRequest;
        state.checkReport = null;
        setCheckIndicator(null);
        renderCheckMessage("Checking", "Inspecting component geometry locally.", null);
        try {
          const query = new URLSearchParams({ path: file.path, v: file.version });
          const response = await fetch(`/api/checks?${query}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`Check request failed: ${response.status}`);
          const report = await response.json();
          if (
            request !== state.checkRequest ||
            file.path !== state.selectedPath ||
            file.version !== state.selectedVersion
          ) {
            return;
          }
          state.checkReport = report;
          setCheckIndicator(report.outcome);
          renderChecks(report);
        } catch (error) {
          if (request !== state.checkRequest) return;
          setCheckIndicator("incomplete");
          renderCheckMessage(
            "Incomplete",
            "Burr could not inspect the selected model.",
            "incomplete",
          );
          console.error(error);
        }
      }

      function ensureChecks() {
        if (!state.viewerReady || state.checkReport) return;
        if (!checksMatchVisiblePose()) {
          renderMotionCheckBoundary();
          return;
        }
        const selected = state.files.find((file) => file.path === state.selectedPath);
        if (selected) loadChecks(selected);
      }

      function checksMatchVisiblePose() {
        return (
          !state.activeMotion ||
          (!state.motionPlaying && state.motionProgress <= 0.0005)
        );
      }

      function syncChecksWithVisiblePose(previouslyAvailable) {
        const available = checksMatchVisiblePose();
        if (available === previouslyAvailable) return;
        state.checkRequest += 1;
        state.checkReport = null;
        state.focusedFinding = null;
        setCheckIndicator(null);
        if (!available) {
          renderMotionCheckBoundary();
          return;
        }
        const selected = state.files.find((file) => file.path === state.selectedPath);
        if (
          state.viewerReady &&
          selected &&
          checksTab.getAttribute("aria-selected") === "true"
        ) {
          loadChecks(selected);
        } else {
          renderCheckMessage(
            "Ready",
            "Open the Checks tab to inspect this model's source pose.",
            null,
          );
        }
      }

      function renderMotionCheckBoundary() {
        const sourceLabel = state.activeMotion?.from_label || "the source pose";
        renderCheckMessage(
          "Source pose only",
          `Move the motion back to ${sourceLabel} before running checks. Animated poses have not been checked.`,
          null,
        );
      }

      function renderChecks(report) {
        renderCheckMessage(capitalize(report.outcome), report.summary, report.outcome);
        for (const reason of report.incomplete_reasons || []) {
          const message = document.createElement("p");
          message.className = "check-reason";
          message.textContent = reason.message;
          checksContent.append(message);
        }

        if (report.findings?.length) {
          const list = document.createElement("div");
          list.className = "finding-list";
          for (const finding of report.findings) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "finding";
            button.setAttribute(
              "aria-current",
              String(finding.id === state.focusedFinding),
            );
            button.title = finding.message;

            const content = document.createElement("div");
            const title = document.createElement("strong");
            title.textContent = `${finding.components[0].name} × ${finding.components[1].name}`;
            const kind = document.createElement("span");
            kind.textContent = witnessLabel(finding.witness?.kind);
            content.append(title, kind);
            button.append(content);
            button.addEventListener("click", () => focusFinding(finding));
            list.append(button);
          }
          checksContent.append(list);
        }

        if (state.focusedFinding) {
          const clear = document.createElement("button");
          clear.type = "button";
          clear.className = "clear-highlight";
          clear.textContent = "Clear component highlight";
          clear.addEventListener("click", clearFindingFocus);
          checksContent.append(clear);
        }
      }

      function renderChecksEmpty() {
        setCheckIndicator(null);
        renderCheckMessage(
          "Select a model",
          "Burr checks STEP assemblies for interfering solid volumes.",
          null,
        );
      }

      function renderCheckMessage(status, summary, outcome) {
        checksContent.replaceChildren();
        const line = document.createElement("div");
        line.className = "check-status-line";
        const dot = document.createElement("span");
        dot.className = `check-dot${outcome ? ` ${outcome}` : ""}`;
        dot.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.className = "check-status";
        label.textContent = status;
        line.append(dot, label);
        const description = document.createElement("p");
        description.className = "check-summary";
        description.textContent = summary;
        checksContent.append(line, description);
      }

      function setCheckIndicator(outcome) {
        checkDot.className = `check-dot${outcome ? ` ${outcome}` : ""}`;
      }

      function focusFinding(finding) {
        const file = state.files.find((candidate) => candidate.path === state.selectedPath);
        if (!file) return;
        state.focusedFinding = finding.id;
        renderChecks(state.checkReport);
        const focus = finding.components.map((component) => component.occurrence_index);
        openViewer(file, false, focus);
      }

      function clearFindingFocus() {
        const file = state.files.find((candidate) => candidate.path === state.selectedPath);
        if (!file) return;
        state.focusedFinding = null;
        renderChecks(state.checkReport);
        openViewer(file);
      }

      function capitalize(value) {
        return value ? value[0].toUpperCase() + value.slice(1) : "Unknown";
      }

      function witnessLabel(kind) {
        if (kind === "containment") return "Contained component";
        if (kind === "coincident_occurrence") return "Coincident components";
        return "Overlapping solid surfaces";
      }

      function setTheme(theme, persist, reloadViewer) {
        state.theme = theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = state.theme;
        themeColor.content = state.theme === "light" ? "#c9ced0" : "#0c0d10";
        const label = state.theme === "light" ? "Light" : "Dark";
        themeToggle.textContent = label;
        themeToggle.setAttribute("aria-pressed", String(state.theme === "light"));
        themeToggle.setAttribute(
          "aria-label",
          state.theme === "light" ? "Use dark theme" : "Use light theme",
        );
        if (persist) localStorage.setItem("burr-theme", state.theme);
        if (reloadViewer && state.selectedPath) {
          const selected = state.files.find((file) => file.path === state.selectedPath);
          if (selected) {
            const finding = state.checkReport?.findings?.find(
              (candidate) => candidate.id === state.focusedFinding,
            );
            const focus = finding
              ? finding.components.map((component) => component.occurrence_index)
              : null;
            openViewer(selected, true, focus);
          }
        }
      }

      function setRenderMode(mode, persist) {
        state.renderMode = mode === "solid" ? "solid" : "x-ray";
        document.documentElement.dataset.renderMode = state.renderMode;
        for (const button of renderModeButtons) {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.renderMode === state.renderMode),
          );
        }
        if (persist) localStorage.setItem("burr-render-mode", state.renderMode);
        sendRenderMode();
      }

      function sendRenderMode() {
        viewer.contentWindow?.postMessage(
          { type: "burr:set-render-mode", mode: state.renderMode },
          window.location.origin,
        );
      }

      function exportSnapshot() {
        if (!state.selectedPath || snapshotButton.disabled) return;
        snapshotButton.disabled = true;
        snapshotButton.textContent = "Exporting…";
        clearTimeout(state.snapshotReset);
        state.snapshotReset = setTimeout(() => {
          snapshotButton.disabled = false;
          snapshotButton.textContent = "Try again";
        }, 5000);
        viewer.contentWindow?.postMessage(
          {
            type: "burr:export-snapshot",
            filename: snapshotFilename(state.selectedPath),
          },
          window.location.origin,
        );
      }

      function receiveViewerMessage(event) {
        if (event.origin !== window.location.origin || event.source !== viewer.contentWindow) return;
        const type = event.data?.type;
        if (type === "burr:viewer-ready") {
          acceptViewerReady(event.data.loadId);
          return;
        }
        if (type === "burr:motion-state") {
          const progress = Number(event.data.progress);
          if (!Number.isFinite(progress)) return;
          const checksWereAvailable = checksMatchVisiblePose();
          state.motionProgress = Math.max(0, Math.min(1, progress));
          state.motionPlaying = Boolean(event.data.playing);
          renderMotionControls();
          syncChecksWithVisiblePose(checksWereAvailable);
          return;
        }
        if (type !== "burr:snapshot-exported" && type !== "burr:snapshot-error") return;
        clearTimeout(state.snapshotReset);
        snapshotButton.disabled = false;
        if (type === "burr:snapshot-exported") {
          snapshotButton.textContent = "Saved";
          snapshotButton.title = `Saved ${event.data.filename}`;
          state.snapshotReset = setTimeout(() => {
            snapshotButton.textContent = "Snapshot";
          }, 1600);
        } else {
          snapshotButton.textContent = "Try again";
          snapshotButton.title = event.data.message || "Snapshot export failed";
        }
      }

      function snapshotFilename(modelPath) {
        const leaf = modelPath.split("/").pop() || "burr-model";
        const stem = leaf.replace(/\.(step|stp|stl|glb)$/i, "");
        const safe =
          stem
            .normalize("NFKD")
            .replace(/[^a-zA-Z0-9._-]+/g, "-")
            .replace(/^-+|-+$/g, "") || "burr-model";
        return `${safe}-${state.renderMode}-${state.theme}.png`;
      }

      function updateCurrentSelection() {
        for (const button of tree.querySelectorAll(".model-file")) {
          button.setAttribute(
            "aria-current",
            String(button.dataset.path === state.selectedPath),
          );
        }
      }
    </script>
  </body>
</html>
