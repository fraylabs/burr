<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d0f" />
    <link rel="icon" type="image/png" href="/assets/burr-logo.png" />
    <title>Burr workbench</title>
    <script>
      (() => {
        const saved = localStorage.getItem("burr-theme");
        const theme =
          saved === "dark" || saved === "light"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #0c0d10;
        --sidebar: #111215;
        --surface: #17191d;
        --surface-hover: #1d2024;
        --surface-selected: #24272c;
        --border: #2a2d33;
        --border-strong: #3b4047;
        --text: #f3f4f5;
        --text-secondary: #b6bbc0;
        --text-muted: #858c92;
        --steel: #aebfc8;
        --steel-surface: #263239;
        --accent: #f08a32;
        --success: #6fbd88;
        --danger: #dd746d;
        --shadow: rgba(0, 0, 0, 0.42);
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-pill: 999px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: var(--canvas);
        color: var(--text);
        font-synthesis: none;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --canvas: #c9ced0;
        --sidebar: #f4f3ef;
        --surface: #fbfaf7;
        --surface-hover: #e9e7e1;
        --surface-selected: #ffffff;
        --border: #d5d2cb;
        --border-strong: #b9b7b0;
        --text: #1b1d1f;
        --text-secondary: #555b60;
        --text-muted: #777e83;
        --steel: #4f6671;
        --steel-surface: #dce4e7;
        --accent: #d86d16;
        --success: #3d8a58;
        --danger: #b94f48;
        --shadow: rgba(31, 35, 38, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      button {
        font: inherit;
      }

      #app {
        display: grid;
        grid-template-columns: 278px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        background: var(--canvas);
      }

      .sidebar {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--border);
        background: var(--sidebar);
      }

      .sidebar-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 74px;
        padding: 14px 17px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .brand-mark {
        flex: 0 0 auto;
        width: 35px;
        height: 35px;
        object-fit: contain;
      }

      .eyebrow {
        margin: 0 0 3px;
        color: var(--text-muted);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1,
      p {
        margin-top: 0;
      }

      h1 {
        max-width: 190px;
        margin-bottom: 0;
        overflow: hidden;
        color: var(--text);
        font-size: 14px;
        font-weight: 680;
        letter-spacing: -0.01em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      [hidden] {
        display: none !important;
      }

      .sidebar-tabs {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 9px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .sidebar-tab {
        min-width: 0;
        min-height: 33px;
        flex: 1 1 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 6px 9px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
      }

      .sidebar-tab:hover {
        background: var(--surface-hover);
        color: var(--text-secondary);
      }

      .sidebar-tab[aria-selected="true"] {
        border-color: var(--border);
        background: var(--surface-selected);
        color: var(--text);
        box-shadow: inset 0 -2px var(--accent);
      }

      .sidebar-tab:focus-visible,
      .finding[data-model-path]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .tab-count {
        min-width: 19px;
        padding: 2px 6px;
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        background: var(--sidebar);
        color: var(--text-muted);
        font-size: 9px;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      #checks-count[data-outcome="pass"] {
        border-color: color-mix(in srgb, var(--success) 45%, var(--border));
        color: var(--success);
      }

      #checks-count[data-outcome="incomplete"] {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
        color: var(--accent);
      }

      #checks-count[data-outcome="fail"] {
        border-color: color-mix(in srgb, var(--danger) 45%, var(--border));
        color: var(--danger);
      }

      .sidebar-panel {
        min-width: 0;
        min-height: 0;
        flex: 1 1 auto;
        overflow: hidden;
      }

      .tree {
        height: 100%;
        min-height: 0;
        overflow: auto;
        padding: 10px 9px 18px;
        scrollbar-color: var(--border-strong) transparent;
        scrollbar-width: thin;
      }

      details {
        margin: 1px 0;
      }

      summary {
        min-width: 0;
        min-height: 31px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 8px;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 620;
        cursor: pointer;
        list-style: none;
        user-select: none;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      summary:hover {
        background: var(--surface-hover);
        color: var(--text);
      }

      .folder-caret {
        flex: 0 0 auto;
        width: 11px;
        color: var(--text-muted);
        font-size: 9px;
        transition: transform 120ms ease;
      }

      details[open] > summary .folder-caret {
        transform: rotate(90deg);
      }

      .folder-icon {
        flex: 0 0 auto;
        width: 13px;
        height: 9px;
        border: 1px solid var(--steel);
        border-radius: 2px;
        background: var(--steel-surface);
        position: relative;
      }

      .folder-name {
        min-width: 0;
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .folder-icon::before {
        content: "";
        position: absolute;
        top: -4px;
        left: -1px;
        width: 6px;
        height: 3px;
        border: 1px solid var(--steel);
        border-bottom: 0;
        border-radius: 2px 2px 0 0;
        background: var(--steel-surface);
      }

      .folder-children {
        margin-left: 9px;
        padding-left: 8px;
        border-left: 1px solid var(--border);
      }

      .model-file {
        width: 100%;
        min-height: 34px;
        display: grid;
        grid-template-columns: 31px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        margin: 1px 0;
        padding: 4px 8px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-secondary);
        text-align: left;
        cursor: pointer;
      }

      .model-file:hover {
        background: var(--surface-hover);
        color: var(--text);
      }

      .model-file[aria-current="true"] {
        border-color: var(--border-strong);
        background: var(--surface-selected);
        color: var(--text);
        box-shadow: inset 2px 0 var(--accent);
      }

      .format-badge {
        padding: 3px 4px;
        border-radius: 4px;
        background: var(--steel-surface);
        color: var(--steel);
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-align: center;
      }

      .file-name {
        min-width: 0;
        overflow: hidden;
        font-size: 11px;
        font-weight: 570;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .empty-tree {
        margin: 13px 8px;
        padding: 17px 14px;
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-md);
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1.55;
      }

      .checks-panel {
        overflow: auto;
        padding: 10px 9px 18px;
        scrollbar-color: var(--border-strong) transparent;
        scrollbar-width: thin;
      }

      .checks-overview,
      .pack-card {
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
      }

      .checks-overview {
        margin-bottom: 9px;
        padding: 13px;
      }

      .outcome-line,
      .pack-heading {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .outcome-dot {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-muted);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--text-muted) 12%, transparent);
      }

      .outcome-dot[data-outcome="pass"] {
        background: var(--success);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 12%, transparent);
      }

      .outcome-dot[data-outcome="incomplete"] {
        background: var(--accent);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 12%, transparent);
      }

      .outcome-dot[data-outcome="fail"] {
        background: var(--danger);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 12%, transparent);
      }

      .checks-overview strong {
        color: var(--text);
        font-size: 12px;
        font-weight: 720;
      }

      .checks-overview p {
        margin: 8px 0 0 16px;
        color: var(--text-muted);
        font-size: 10px;
        line-height: 1.45;
      }

      .pack-card {
        margin-top: 9px;
        overflow: hidden;
      }

      .pack-header {
        padding: 12px;
        border-bottom: 1px solid var(--border);
      }

      .pack-heading {
        justify-content: space-between;
      }

      .pack-name {
        min-width: 0;
        overflow: hidden;
        color: var(--text);
        font-size: 11px;
        font-weight: 680;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .outcome-chip {
        flex: 0 0 auto;
        padding: 3px 6px;
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        color: var(--text-muted);
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .outcome-chip[data-outcome="pass"] {
        border-color: color-mix(in srgb, var(--success) 42%, var(--border));
        color: var(--success);
      }

      .outcome-chip[data-outcome="incomplete"] {
        border-color: color-mix(in srgb, var(--accent) 42%, var(--border));
        color: var(--accent);
      }

      .outcome-chip[data-outcome="fail"] {
        border-color: color-mix(in srgb, var(--danger) 42%, var(--border));
        color: var(--danger);
      }

      .pack-meta {
        margin: 6px 0 0;
        overflow: hidden;
        color: var(--text-muted);
        font-size: 9px;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .finding-list {
        display: grid;
        gap: 1px;
        padding: 4px;
      }

      .finding {
        width: 100%;
        display: block;
        padding: 9px 8px;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: inherit;
        text-align: left;
      }

      button.finding {
        cursor: pointer;
      }

      button.finding:hover {
        background: var(--surface-hover);
      }

      .finding-title {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        color: var(--text-secondary);
        font-size: 10px;
        font-weight: 650;
        line-height: 1.35;
      }

      .finding-mark {
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        margin-top: 3px;
        border-radius: 50%;
        background: var(--text-muted);
      }

      .finding[data-severity="error"] .finding-mark {
        background: var(--danger);
      }

      .finding[data-severity="warning"] .finding-mark {
        background: var(--accent);
      }

      .finding-message,
      .finding-remediation {
        margin: 5px 0 0 14px;
        color: var(--text-muted);
        font-size: 9px;
        line-height: 1.45;
      }

      .finding-remediation {
        color: var(--text-secondary);
      }

      .finding-model {
        display: block;
        margin: 6px 0 0 14px;
        color: var(--steel);
        font-size: 8px;
        font-weight: 750;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .pack-empty {
        padding: 10px 12px 12px;
        color: var(--text-muted);
        font-size: 9px;
        line-height: 1.45;
      }

      .notice-group {
        margin: 0;
        border-top: 1px solid var(--border);
      }

      .notice-group > summary {
        min-height: 36px;
        padding: 8px 12px;
        border-radius: 0;
        color: var(--text-muted);
        font-size: 9px;
        font-weight: 650;
      }

      .notice-group > summary .folder-caret {
        margin-left: auto;
      }

      .notice-list {
        display: grid;
        gap: 1px;
        padding: 0 4px 4px;
      }

      .sidebar-footer {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 47px;
        padding: 0 17px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-muted);
        font-size: 10px;
      }

      .watch-status-group {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #watch-status {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .theme-toggle {
        flex: 0 0 auto;
        min-width: 48px;
        margin-left: auto;
        padding: 5px 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        background: var(--sidebar);
        color: var(--text-secondary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.03em;
        cursor: pointer;
      }

      .theme-toggle:hover {
        border-color: var(--border-strong);
        background: var(--surface-hover);
        color: var(--text);
      }

      .theme-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .watch-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 12%, transparent);
      }

      .watch-dot.error {
        background: var(--danger);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 12%, transparent);
      }

      .viewer {
        position: relative;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
        background: var(--canvas);
      }

      #model-viewer {
        width: 100%;
        height: 100%;
        display: block;
        border: 0;
        background: var(--canvas);
      }

      .viewer-state {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--canvas);
        z-index: 2;
      }

      .viewer-state[hidden] {
        display: none;
      }

      .state-content {
        max-width: 420px;
        text-align: center;
      }

      .state-mark {
        width: 38px;
        height: 38px;
        margin: 0 auto 18px;
        border: 1px solid var(--border-strong);
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--steel);
        font-size: 18px;
      }

      .state-content strong {
        display: block;
        margin-bottom: 7px;
        color: var(--text);
        font-size: 14px;
      }

      .state-content p {
        margin-bottom: 0;
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1.6;
      }

      .loading-ring {
        width: 23px;
        height: 23px;
        border: 2px solid var(--border-strong);
        border-top-color: var(--steel);
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 720px) {
        #app {
          grid-template-columns: 220px minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" aria-label="Burr project sidebar">
        <header class="sidebar-header">
          <img class="brand-mark" src="/assets/burr-logo.png" alt="" />
          <div>
            <p class="eyebrow">Burr</p>
            <h1 id="root-name">Burr project</h1>
          </div>
        </header>

        <div class="sidebar-tabs" role="tablist" aria-label="Project tools">
          <button
            id="models-tab"
            class="sidebar-tab"
            type="button"
            role="tab"
            aria-controls="models-panel"
            aria-selected="true"
          >
            Models
            <span id="model-count" class="tab-count">0</span>
          </button>
          <button
            id="checks-tab"
            class="sidebar-tab"
            type="button"
            role="tab"
            aria-controls="checks-panel"
            aria-selected="false"
          >
            Checks
            <span id="checks-count" class="tab-count" data-outcome="none">—</span>
          </button>
        </div>

        <section
          id="models-panel"
          class="sidebar-panel"
          role="tabpanel"
          aria-labelledby="models-tab"
        >
          <nav id="tree" class="tree" aria-label="Supported model files"></nav>
        </section>

        <section
          id="checks-panel"
          class="sidebar-panel checks-panel"
          role="tabpanel"
          aria-labelledby="checks-tab"
          hidden
        >
          <div class="empty-tree">Loading configured checks…</div>
        </section>

        <footer class="sidebar-footer">
          <div class="watch-status-group">
            <span id="watch-dot" class="watch-dot" aria-hidden="true"></span>
            <span id="watch-status">Watching for model changes</span>
          </div>
          <button id="theme-toggle" class="theme-toggle" type="button">Dark</button>
        </footer>
      </aside>

      <main class="viewer" aria-label="Selected model viewer">
        <iframe id="model-viewer" title="Selected 3D model"></iframe>

        <div id="empty-state" class="viewer-state">
          <div class="state-content">
            <div class="state-mark" aria-hidden="true">⌁</div>
            <strong>No supported models found</strong>
            <p>Add a STEP, STL, or GLB file anywhere inside this folder.</p>
          </div>
        </div>

        <div id="loading-state" class="viewer-state" hidden>
          <div class="state-content">
            <div class="state-mark" aria-hidden="true">
              <span class="loading-ring"></span>
            </div>
            <strong id="loading-title">Preparing model</strong>
            <p>Look is tessellating the source file locally.</p>
          </div>
        </div>
      </main>
    </div>

    <script>
      const rootName = document.querySelector("#root-name");
      const modelCount = document.querySelector("#model-count");
      const checksCount = document.querySelector("#checks-count");
      const modelsTab = document.querySelector("#models-tab");
      const checksTab = document.querySelector("#checks-tab");
      const modelsPanel = document.querySelector("#models-panel");
      const checksPanel = document.querySelector("#checks-panel");
      const tree = document.querySelector("#tree");
      const viewer = document.querySelector("#model-viewer");
      const emptyState = document.querySelector("#empty-state");
      const loadingState = document.querySelector("#loading-state");
      const loadingTitle = document.querySelector("#loading-title");
      const watchDot = document.querySelector("#watch-dot");
      const watchStatus = document.querySelector("#watch-status");
      const themeToggle = document.querySelector("#theme-toggle");
      const themeColor = document.querySelector('meta[name="theme-color"]');

      const state = {
        files: [],
        selectedPath: null,
        selectedVersion: null,
        signature: "",
        expanded: new Set(),
        initialized: false,
        refreshing: false,
        checks: null,
        activePanel: "models",
        theme: document.documentElement.dataset.theme === "light" ? "light" : "dark",
      };

      viewer.addEventListener("load", () => {
        loadingState.hidden = true;
      });

      themeToggle.addEventListener("click", () => {
        setTheme(state.theme === "dark" ? "light" : "dark", true, true);
      });
      modelsTab.addEventListener("click", () => setSidebarPanel("models"));
      checksTab.addEventListener("click", () => setSidebarPanel("checks"));

      setTheme(state.theme, false, false);
      refreshTree();
      refreshChecks();
      setInterval(refreshTree, 1000);

      async function refreshChecks() {
        try {
          const response = await fetch("/api/checks", { cache: "no-store" });
          if (!response.ok) throw new Error(`Checks request failed: ${response.status}`);
          const payload = await response.json();
          state.checks = payload;
          renderChecks(payload);
        } catch (error) {
          checksCount.textContent = "!";
          checksCount.dataset.outcome = "fail";
          checksPanel.replaceChildren();
          const message = document.createElement("div");
          message.className = "empty-tree";
          message.textContent = "Could not load check results.";
          checksPanel.append(message);
          console.error(error);
        }
      }

      async function refreshTree() {
        if (state.refreshing) return;
        state.refreshing = true;
        try {
          const response = await fetch("/api/tree", { cache: "no-store" });
          if (!response.ok) throw new Error(`Tree request failed: ${response.status}`);
          const payload = await response.json();
          applyTree(payload);
          watchDot.classList.remove("error");
          watchStatus.textContent = "Watching for model changes";
        } catch (error) {
          watchDot.classList.add("error");
          watchStatus.textContent = "Could not refresh model files";
          console.error(error);
        } finally {
          state.refreshing = false;
        }
      }

      function applyTree(payload) {
        const files = Array.isArray(payload.files) ? payload.files : [];
        rootName.textContent = payload.root || "Burr project";
        rootName.title = payload.root || "Burr project";
        modelCount.textContent = String(files.length);

        const signature = JSON.stringify(files.map((file) => [file.path, file.version]));
        const selected = files.find((file) => file.path === state.selectedPath);
        const selectedChanged = selected && selected.version !== state.selectedVersion;
        const selectionRemoved = state.selectedPath && !selected;

        state.files = files;
        if (signature !== state.signature) {
          state.signature = signature;
          renderTree(files);
          if (state.checks) renderChecks(state.checks);
        }

        if (files.length === 0) {
          state.selectedPath = null;
          state.selectedVersion = null;
          viewer.removeAttribute("src");
          loadingState.hidden = true;
          emptyState.hidden = false;
          return;
        }

        emptyState.hidden = true;
        if (!state.selectedPath || selectionRemoved) {
          selectFile(files[0]);
        } else if (selectedChanged) {
          selectFile(selected, true);
        }
      }

      function renderTree(files) {
        const openFolders = new Set(state.expanded);
        const hierarchy = { folders: new Map(), files: [] };
        for (const file of files) {
          const pieces = file.path.split("/");
          let node = hierarchy;
          for (const piece of pieces.slice(0, -1)) {
            if (!node.folders.has(piece)) {
              node.folders.set(piece, { folders: new Map(), files: [] });
            }
            node = node.folders.get(piece);
          }
          node.files.push(file);
        }

        tree.replaceChildren();
        if (files.length === 0) {
          const message = document.createElement("div");
          message.className = "empty-tree";
          message.textContent = "No .step, .stp, .stl, or .glb files in this folder.";
          tree.append(message);
          return;
        }

        const fragment = document.createDocumentFragment();
        renderNode(hierarchy, fragment, "", openFolders);
        tree.append(fragment);
        state.initialized = true;
        updateCurrentSelection();
      }

      function renderNode(node, parent, prefix, openFolders) {
        const folders = [...node.folders.entries()].sort(([left], [right]) =>
          left.localeCompare(right, undefined, { sensitivity: "base" }),
        );
        for (const [name, child] of folders) {
          const key = prefix ? `${prefix}/${name}` : name;
          const details = document.createElement("details");
          details.dataset.folder = key;
          details.open = openFolders.has(key);
          if (details.open) state.expanded.add(key);
          details.addEventListener("toggle", () => {
            if (details.open) state.expanded.add(key);
            else state.expanded.delete(key);
          });

          const summary = document.createElement("summary");
          summary.title = key;
          const caret = document.createElement("span");
          caret.className = "folder-caret";
          caret.textContent = "▶";
          const icon = document.createElement("span");
          icon.className = "folder-icon";
          icon.setAttribute("aria-hidden", "true");
          const label = document.createElement("span");
          label.className = "folder-name";
          label.textContent = name;
          summary.append(caret, icon, label);

          const children = document.createElement("div");
          children.className = "folder-children";
          renderNode(child, children, key, openFolders);
          details.append(summary, children);
          parent.append(details);
        }

        const files = [...node.files].sort((left, right) =>
          left.name.localeCompare(right.name, undefined, { sensitivity: "base" }),
        );
        for (const file of files) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "model-file";
          button.dataset.path = file.path;
          button.title = file.path;
          button.addEventListener("click", () => selectFile(file));

          const badge = document.createElement("span");
          badge.className = "format-badge";
          badge.textContent = file.format;
          const label = document.createElement("span");
          label.className = "file-name";
          label.textContent = file.name;
          button.append(badge, label);
          parent.append(button);
        }
      }

      function selectFile(file, refreshed = false) {
        state.selectedPath = file.path;
        state.selectedVersion = file.version;
        updateCurrentSelection();
        emptyState.hidden = true;
        loadingState.hidden = false;
        loadingTitle.textContent = refreshed ? `Reloading ${file.name}` : `Opening ${file.name}`;
        const query = new URLSearchParams({
          path: file.path,
          v: file.version,
          theme: state.theme,
        });
        viewer.src = `/viewer?${query}`;
      }

      function setSidebarPanel(panel) {
        state.activePanel = panel === "checks" ? "checks" : "models";
        const showingChecks = state.activePanel === "checks";
        modelsTab.setAttribute("aria-selected", String(!showingChecks));
        checksTab.setAttribute("aria-selected", String(showingChecks));
        modelsPanel.hidden = showingChecks;
        checksPanel.hidden = !showingChecks;
      }

      function renderChecks(payload) {
        const packs = Array.isArray(payload.packs) ? payload.packs : [];
        const outcome = normalizeOutcome(payload.outcome);
        const allFindings = packs.flatMap((pack) =>
          Array.isArray(pack.findings) ? pack.findings : [],
        );
        const actionableCount = allFindings.filter(
          (finding) => finding.severity !== "notice",
        ).length;
        const noticeCount = allFindings.length - actionableCount;
        checksCount.textContent = String(actionableCount);
        checksCount.dataset.outcome = outcome;
        checksCount.title =
          packs.length === 0
            ? "No checks enabled"
            : `${actionableCount} actionable ${pluralize(actionableCount, "finding")} across ${packs.length} ${pluralize(packs.length, "pack")}`;

        const fragment = document.createDocumentFragment();
        const overview = document.createElement("section");
        overview.className = "checks-overview";
        overview.setAttribute("aria-label", "Check summary");
        const outcomeLine = document.createElement("div");
        outcomeLine.className = "outcome-line";
        const dot = document.createElement("span");
        dot.className = "outcome-dot";
        dot.dataset.outcome = outcome;
        dot.setAttribute("aria-hidden", "true");
        const heading = document.createElement("strong");
        heading.textContent = packs.length === 0 ? "Checks not run" : `Checks ${outcomeLabel(outcome)}`;
        outcomeLine.append(dot, heading);
        const description = document.createElement("p");
        description.textContent =
          packs.length === 0
            ? "No project rule packs are enabled."
            : [
                `${packs.length} ${pluralize(packs.length, "pack")}`,
                `${actionableCount} ${pluralize(actionableCount, "finding")}`,
                noticeCount > 0 ? `${noticeCount} ${pluralize(noticeCount, "notice")}` : null,
              ]
                .filter(Boolean)
                .join(" · ");
        overview.append(outcomeLine, description);
        fragment.append(overview);

        for (const pack of packs) {
          fragment.append(renderPack(pack));
        }

        checksPanel.replaceChildren(fragment);
      }

      function renderPack(pack) {
        const outcome = normalizeOutcome(pack.outcome);
        const findings = Array.isArray(pack.findings) ? pack.findings : [];
        const actionableFindings = findings.filter((finding) => finding.severity !== "notice");
        const notices = findings.filter((finding) => finding.severity === "notice");
        const summary = pack.summary || {};
        const card = document.createElement("section");
        card.className = "pack-card";
        card.dataset.packId = pack.id || "unknown";

        const header = document.createElement("header");
        header.className = "pack-header";
        const heading = document.createElement("div");
        heading.className = "pack-heading";
        const name = document.createElement("span");
        name.className = "pack-name";
        name.textContent = formatPackName(pack.id);
        name.title = pack.id || "Unknown pack";
        const chip = document.createElement("span");
        chip.className = "outcome-chip";
        chip.dataset.outcome = outcome;
        chip.textContent = outcomeLabel(outcome);
        heading.append(name, chip);

        const meta = document.createElement("p");
        meta.className = "pack-meta";
        const targetCount = Number(summary.targets) || 0;
        const targetDetail =
          targetCount === 0
            ? "no targets evaluated"
            : `${Number(summary.targets_passed) || 0}/${targetCount} targets passed`;
        meta.textContent = `${pack.source || "pack"} · v${pack.version || "unknown"} · ${targetDetail}`;
        header.append(heading, meta);
        card.append(header);

        if (actionableFindings.length === 0 && notices.length === 0) {
          const empty = document.createElement("div");
          empty.className = "pack-empty";
          empty.textContent =
            outcome === "pass"
              ? "All evaluated targets passed with no findings."
              : "This pack returned no individual findings.";
          card.append(empty);
          return card;
        }

        if (actionableFindings.length > 0) {
          const list = document.createElement("div");
          list.className = "finding-list";
          for (const finding of actionableFindings) {
            list.append(renderFinding(finding));
          }
          card.append(list);
        }

        if (notices.length > 0) {
          const group = document.createElement("details");
          group.className = "notice-group";
          const summary = document.createElement("summary");
          const label = document.createElement("span");
          label.textContent = `${notices.length} ${pluralize(notices.length, "notice")}`;
          const caret = document.createElement("span");
          caret.className = "folder-caret";
          caret.textContent = "▶";
          summary.append(label, caret);
          const list = document.createElement("div");
          list.className = "notice-list";
          for (const notice of notices) {
            list.append(renderFinding(notice));
          }
          group.append(summary, list);
          card.append(group);
        }
        return card;
      }

      function renderFinding(finding) {
        const modelPath = linkedModelPath(finding);
        const item = document.createElement(modelPath ? "button" : "article");
        if (modelPath) {
          item.type = "button";
          item.dataset.modelPath = modelPath;
          item.addEventListener("click", () => {
            const file = state.files.find((candidate) => candidate.path === modelPath);
            if (file) selectFile(file);
          });
        }
        item.className = "finding";
        item.dataset.severity = finding.severity || "notice";
        item.dataset.findingCode = finding.code || "finding";

        const title = document.createElement("div");
        title.className = "finding-title";
        const mark = document.createElement("span");
        mark.className = "finding-mark";
        mark.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.textContent = finding.title || formatFindingCode(finding.code);
        title.append(mark, label);

        const message = document.createElement("p");
        message.className = "finding-message";
        message.textContent = finding.message || "Burr reported a design finding.";
        item.append(title, message);

        if (finding.remediation) {
          const remediation = document.createElement("p");
          remediation.className = "finding-remediation";
          remediation.textContent = `Fix: ${finding.remediation}`;
          item.append(remediation);
        }
        if (modelPath) {
          const model = document.createElement("span");
          model.className = "finding-model";
          model.textContent = `Open ${modelPath.split("/").at(-1)} →`;
          item.append(model);
        }
        return item;
      }

      function linkedModelPath(finding) {
        const geometry = Array.isArray(finding.geometry) ? finding.geometry : [];
        for (const reference of geometry) {
          if (state.files.some((file) => file.path === reference.model_path)) {
            return reference.model_path;
          }
        }
        return null;
      }

      function normalizeOutcome(outcome) {
        return ["pass", "incomplete", "fail"].includes(outcome) ? outcome : "none";
      }

      function outcomeLabel(outcome) {
        if (outcome === "pass") return "passed";
        if (outcome === "incomplete") return "incomplete";
        if (outcome === "fail") return "failed";
        return "not run";
      }

      function formatPackName(id) {
        const value = typeof id === "string" ? id.replace(/^[^:]+:/, "") : "unknown pack";
        return value
          .split(/[-_]/)
          .filter(Boolean)
          .map((word) => word[0].toUpperCase() + word.slice(1))
          .join(" ");
      }

      function formatFindingCode(code) {
        if (typeof code !== "string") return "Design finding";
        return code
          .split("_")
          .filter(Boolean)
          .map((word) => word[0].toUpperCase() + word.slice(1))
          .join(" ");
      }

      function pluralize(count, singular) {
        return count === 1 ? singular : `${singular}s`;
      }

      function setTheme(theme, persist, reloadViewer) {
        state.theme = theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = state.theme;
        themeColor.content = state.theme === "light" ? "#c9ced0" : "#0c0d10";
        const label = state.theme === "light" ? "Light" : "Dark";
        themeToggle.textContent = label;
        themeToggle.setAttribute("aria-pressed", String(state.theme === "light"));
        themeToggle.setAttribute(
          "aria-label",
          state.theme === "light" ? "Use dark theme" : "Use light theme",
        );
        if (persist) localStorage.setItem("burr-theme", state.theme);
        if (reloadViewer && state.selectedPath) {
          const selected = state.files.find((file) => file.path === state.selectedPath);
          if (selected) selectFile(selected, true);
        }
      }

      function updateCurrentSelection() {
        for (const button of tree.querySelectorAll(".model-file")) {
          button.setAttribute(
            "aria-current",
            String(button.dataset.path === state.selectedPath),
          );
        }
      }
    </script>
  </body>
</html>
