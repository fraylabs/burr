name: Install smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published Burr version or tag
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  install_smoke:
    name: install smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and check published Burr without Rust
        env:
          BURR_SMOKE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: python3 scripts/check-installed-burr.py --version "$BURR_SMOKE_VERSION"
