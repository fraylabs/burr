name: Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Check formatting, lint, locks, schemas, and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:static

      - name: Confirm checks did not modify tracked files
        run: git diff --exit-code

  core:
    name: Core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.11

      - name: Sync Python workspace
        run: uv sync --locked --all-packages

      - name: Check core and trust contract
        run: npm run check:core

  build123d:
    name: Build123d Examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.11

      - name: Sync Python workspace
        run: uv sync --locked --all-packages

      - name: Check build123d examples
        run: npm run check:build123d

      - name: Check optional OCP STEP backend
        run: npm run check:ocp

      - name: Check mixed-intent CAD proof
        run: npm run check:mixed-intent

      - name: Check bearing-seat CAD proof
        run: npm run check:bearing-seat

      - name: Check counterbore CAD proof
        run: npm run check:counterbore

      - name: Check heat-set insert pocket CAD proof
        run: npm run check:insert-pocket

      - name: Check straight-slot CAD proof
        run: npm run check:slots

      - name: Check printable gallery
        run: npm run check:gallery

      - name: Check gallery render proof
        run: npm run check:gallery:render

      - name: Check gallery release artifact
        run: npm run check:gallery:artifact

      - name: Confirm generated artifacts are untracked
        run: |
          test -z "$(git status --short --untracked-files=no)"

  release-candidate:
    name: Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.11

      - name: Build and install candidate artifacts
        run: npm run check:release-candidate

  fresh-install:
    name: Fresh Install
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.11

      - name: Check published install and starter fix loop
        run: npm run check:fresh-install
